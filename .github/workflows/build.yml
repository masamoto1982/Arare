name: Build and Deploy the Arare Playground

on:
  push:
    branches: [ main ]
  # Manual trigger, so a push whose run was never created can still be
  # deployed without inventing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update asset version stamps
        run: |
          VERSION=$(date -u +%Y%m%d%H%M)
          sed -i "s/?v=[0-9]*/?v=${VERSION}/g" index.html

      # Until Arare's engine is connected (Phase 5), the Playground runs the
      # pinned Ajisai oracle bundle committed in src/wasm/ajisai-oracle/, so
      # there is no WebAssembly to build here.
      - name: Build with Vite
        run: npm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
