name: Build and Deploy the Arare Playground

on:
  push:
    branches: [ main ]
  # Manual trigger, so a push whose run was never created can still be
  # deployed without inventing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update asset version stamps
        run: |
          VERSION=$(date -u +%Y%m%d%H%M)
          sed -i "s/?v=[0-9]*/?v=${VERSION}/g" index.html

      # `npm run build` builds Arare's engine for wasm32-wasip1 first
      # (scripts/build-engine.mjs, ADR-0013); the Ajisai oracle bundle is
      # committed in src/wasm/ajisai-oracle/.
      - name: Add the engine's WebAssembly target
        working-directory: rust
        run: rustup target add wasm32-wasip1

      - name: Build with Vite
        run: npm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
