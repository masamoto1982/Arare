name: Publish MCP server

# Publishes tools/mcp-server to npm and then registers it in the official MCP
# Registry. The registry holds metadata only: its entry (server.json) points at
# the npm package, and the registry checks that package's `mcpName` to verify
# ownership, so npm must answer for the version before the registry is told
# about it.
#
# Release by pushing a tag `mcp-v<version>` whose version equals
# tools/mcp-server/package.json's. workflow_dispatch re-runs a release whose
# run failed part-way: the npm step skips a version npm already holds, so a run
# that failed at the registry can be repeated. The registry refuses a version
# it already lists, so a run that got that far has nothing left to do.
#
# npm authenticates this workflow by Trusted Publishing: the package's
# settings on npmjs.com name this repository and this workflow file
# (`publish-mcp.yml`) as its trusted publisher, and `npm publish` exchanges
# the job's GitHub OIDC token for a short-lived publish credential. There is
# no long-lived npm token to expire or leak; one that had expired is what
# refused 0.9.0's first run with a 404 on the PUT.
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm's Trusted Publishing and provenance, and the MCP Registry's GitHub
  # OIDC login, all mint an identity token for this repository.
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm that publishes by Trusted Publishing
        # The OIDC exchange needs npm 11.5.1 or later; Node 20 ships npm 10.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME}" != "mcp-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name package.json version ${version}" >&2
            exit 1
          fi

      - name: Packaged assets and server.json agree
        run: npm run check:assets

      - name: The packaged backend computes
        run: node index.js --doctor

      - name: Self-test against the packaged WASM backend
        run: npm run selftest

      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "ajisai-mcp-server@${version}" version 2>/dev/null)" = "${version}" ]; then
            echo "ajisai-mcp-server@${version} is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Wait until npm serves the version
        # The registry verifies the package by fetching it from npm, which can
        # lag a publish (and holds a package's first release for review): 0.7.0's
        # first registration was refused because npm did not yet answer for it.
        run: |
          version=$(node -p 'require("./package.json").version')
          for attempt in $(seq 1 45); do
            if [ "$(npm view "ajisai-mcp-server@${version}" version 2>/dev/null)" = "${version}" ]; then
              echo "npm serves ajisai-mcp-server@${version}"
              exit 0
            fi
            sleep 20
          done
          echo "npm does not serve ajisai-mcp-server@${version} after 15 minutes; re-run this workflow once it does" >&2
          exit 1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json against the registry
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
