name: Test Arare

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every step in every job is blocking (docs/quality/QUALITY_ASSURANCE_PLAN.md):
# an advisory gate produces green checkmarks that certify nothing.
jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # rust/rust-toolchain.toml pins the stable toolchain; rustup installs it
      # on the first cargo call, so the runner's own stable never builds Arare.
      - name: Install cargo-llvm-cov
        # Pinned (docs/quality/CONFIGURATION_INDEX.md) so a release cannot
        # change the counts the coverage ratchet compares.
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust all-target tests
        working-directory: rust
        run: cargo test --all-targets --verbose

      - name: Rust branch coverage
        # --branch needs a nightly rustc. The nightly is the one
        # docs/quality/coverage-baseline.json names, and proptest's seed is
        # fixed, so the counts the ratchet compares are reproducible.
        working-directory: rust
        env:
          PROPTEST_RNG_SEED: '20261010'
        run: |
          rustup toolchain install nightly-2026-10-09 --profile minimal --component llvm-tools-preview
          cargo +nightly-2026-10-09 llvm-cov --branch --workspace --no-report
          mkdir -p target/coverage
          cargo +nightly-2026-10-09 llvm-cov report --branch --json --summary-only --output-path target/coverage/coverage.json
          cargo +nightly-2026-10-09 llvm-cov report --branch --lcov --output-path target/coverage/lcov.info

      - name: Upload Rust coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust/target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Requirements registry and its generated surfaces
        run: npm run check:requirements

      - name: Traceability matrix against the source
        run: npm run check:traceability

      # AR-VER-209: the oracle corpus against the pinned Ajisai build (ADR-0007).
      - name: Arare agrees with the Ajisai oracle
        run: npm run check:oracle

      # AR-VER-217: the inferred error budget holds against Ajisai on at least
      # 10,000 generated programs (WORK_ORDER.md §7, Phase 3's exit criterion).
      - name: The error budget holds on generated programs
        run: npm run check:oracle-random

      - name: Package, crate and Tauri versions agree
        run: npm run check:version-sync

      - name: Rust file-size budget
        run: npm run check:file-size

      - name: Playground colours meet WCAG contrast
        run: npm run check:contrast

      - name: TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: TypeScript tests (Vitest, with coverage)
        run: npm run test:coverage

      - name: Upload TypeScript coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: coverage/ts/
          if-no-files-found: error
          retention-days: 14

      - name: Coverage summary
        run: >-
          node scripts/coverage-summary.mjs
          --rust rust/target/coverage/coverage.json
          --ts coverage/ts/coverage-summary.json
          >> "$GITHUB_STEP_SUMMARY"

      - name: QL-A / QL-B coverage ratchet
        run: npm run check:coverage-ratchet

      - name: Playground builds
        run: npm run build

  formal-verification-kani:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    # A solver that does not finish should fail the run, not hold it for the
    # six-hour default.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Kani pins its own nightly and solvers; its version is pinned here and
      # in docs/quality/CONFIGURATION_INDEX.md so a Kani release cannot change
      # what is proved.
      - name: Cache Kani
        id: kani-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: ${{ runner.os }}-kani-0.68.0

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      # `cargo kani` succeeds when it finds no harness at all, so the job also
      # holds the number verified to the number the source declares.
      - name: Prove every harness
        working-directory: rust
        run: |
          set -o pipefail
          cargo kani --workspace --jobs --output-format terse | tee "$RUNNER_TEMP/kani.log"
          declared=$(grep -rho '#\[kani::proof\]' crates | wc -l)
          verified=$(grep -oE 'Complete - [0-9]+ successfully verified' "$RUNNER_TEMP/kani.log" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Kani verified $verified of $declared declared harness(es)."
          if [ "$verified" -ne "$declared" ]; then
            echo "::error::Kani verified $verified harness(es) but the source declares $declared."
            exit 1
          fi

  formal-verification-lean:
    name: Formal Verification (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache the Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('formal/lean-toolchain') }}

      # elan reads formal/lean-toolchain and installs exactly that toolchain.
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check every proof
        working-directory: formal
        run: lake build

      # lake build accepts `sorry` with a warning; this asks Lean what every
      # theorem rests on and fails on anything beyond the standard axioms.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Every theorem rests only on the standard axioms
        run: node scripts/check-formal-axioms.mjs

      # AR-VER-201: the Lean model and the Rust executable specification print
      # the same table over the same grid; any difference fails the job.
      # rust/rust-toolchain.toml makes rustup install the pinned toolchain.
      - name: The Rust specification agrees with the Lean model
        run: |
          (cd formal && lake build arare-table && lake exe arare-table > "$RUNNER_TEMP/lean-table.txt")
          (cd rust && cargo run --quiet --release -p arare-spec --example lean_table > "$RUNNER_TEMP/rust-table.txt")
          if ! diff -u "$RUNNER_TEMP/lean-table.txt" "$RUNNER_TEMP/rust-table.txt" > "$RUNNER_TEMP/table.diff"; then
            head -40 "$RUNNER_TEMP/table.diff"
            echo "::error::The Rust specification and the Lean model disagree ($(grep -c '^[-+][^-+]' "$RUNNER_TEMP/table.diff") lines)."
            exit 1
          fi
          echo "Lean and Rust agree on all $(wc -l < "$RUNNER_TEMP/lean-table.txt") lines."

      # AR-VER-215: the Lean checker and the Rust checker infer the same over
      # the same grid of expressions; any difference fails the job.
      - name: The Rust checker agrees with the Lean checker
        run: |
          (cd formal && lake build arare-budget-table && lake exe arare-budget-table > "$RUNNER_TEMP/lean-budget.txt")
          (cd rust && cargo run --quiet --release -p arare-budget --example budget_table > "$RUNNER_TEMP/rust-budget.txt")
          if ! diff -u "$RUNNER_TEMP/lean-budget.txt" "$RUNNER_TEMP/rust-budget.txt" > "$RUNNER_TEMP/budget.diff"; then
            head -40 "$RUNNER_TEMP/budget.diff"
            echo "::error::The Rust checker and the Lean checker disagree ($(grep -c '^[-+][^-+]' "$RUNNER_TEMP/budget.diff") lines)."
            exit 1
          fi
          echo "Lean and Rust agree on all $(wc -l < "$RUNNER_TEMP/lean-budget.txt") lines."
