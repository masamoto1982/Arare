# Arare's Rust workspace (WORK_ORDER.md §8). Each crate's quality level is the
# one docs/quality/PLAN_OVERVIEW.md assigns; the level decides what evidence a
# change to it must carry (docs/quality/VERIFICATION_PLAN.md).
[workspace]
resolver = "2"
members = [
  "crates/arare-spec",
  "crates/arare-kernel",
  "crates/arare-front",
  "crates/arare-budget",
  "crates/arare-interp",
  "crates/arare-codegen",
  "crates/arare-wasm",
  "crates/arare-cli",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/masamoto1982/Arare"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo kani` sets cfg(kani); declaring it keeps `clippy -D warnings` quiet
# about the proof harnesses that compile only under it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
