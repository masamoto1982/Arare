# The performance benchmarks (AR-VER-221, WORK_ORDER.md §6). A workspace of
# its own: it builds Ajisai, pinned to the commit UPSTREAM.md records, to
# time it in the same run, and the main workspace must not build Ajisai.
[package]
name = "arare-bench"
description = "Arare's compiled route timed against hand-written loops and Ajisai's native build"
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
arare-budget = { path = "../crates/arare-budget" }
arare-codegen = { path = "../crates/arare-codegen" }
arare-compiled = { path = "../crates/arare-compiled" }
arare-front = { path = "../crates/arare-front" }
arare-interp = { path = "../crates/arare-interp" }
arare-kernel = { path = "../crates/arare-kernel" }
# Ajisai's exact answers are rationals of a million bits; the budget is
# checked against them in big integers (the version Ajisai itself uses).
num-bigint = "0.4"
ajisai-core = { git = "https://github.com/masamoto1982/Ajisai", rev = "0bb45c6aaf7c9603c1ec5fec37bc8aadc4800bcc" }

[profile.release]
codegen-units = 1
lto = "thin"
